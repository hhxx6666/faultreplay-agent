[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "faultreplay-agent"
version = "0.1.0"
description = "Turn event logs into pytest regressions with budgeted replay reduction"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
faultreplay = "faultreplay.cli:main"

[tool.setuptools.package-data]
faultreplay = ["examples/corridor/*.json", "examples/corridor/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
